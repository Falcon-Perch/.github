<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Falcon Perch: Be anywhere. Stay private.">
  <defs>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#F2B807" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2B807" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#17222B" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#17222B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="400" fill="#17222B"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
    <!-- contour rings around the perch -->
    <g fill="none" stroke="#E6ECF0" stroke-opacity="0.08">
      <circle cx="1000" cy="190" r="60"/><circle cx="1000" cy="190" r="110"/><circle cx="1000" cy="190" r="160"/>
      <circle cx="1000" cy="190" r="210"/><circle cx="1000" cy="190" r="260"/><circle cx="1000" cy="190" r="310"/>
    </g>
    <!-- stylised streets -->
    <g stroke="#2C3B46" stroke-width="10" stroke-linecap="round" opacity="0.55">
      <path d="M640 330 L1290 250"/><path d="M820 -10 L780 410"/><path d="M1150 -10 L1190 410"/><path d="M660 80 L1290 120"/>
    </g>
    <path d="M640 230 C 760 190, 860 260, 960 225 S 1180 160, 1290 200 L1290 228 C 1180 192, 1080 262, 962 254 S 760 222, 640 262Z" fill="#7FB3D5" opacity="0.25"/>
    <rect width="1280" height="400" fill="url(#fade)"/>
    <!-- dotted route from the real location to the perch -->
    <path d="M760 330 C 820 300, 860 250, 930 230 S 980 205, 990 196" fill="none" stroke="#F2B807" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
    <g opacity="0.6"><circle cx="760" cy="330" r="9" fill="none" stroke="#93A6B4" stroke-width="3"/><path d="M752 322 L768 338 M768 322 L752 338" stroke="#93A6B4" stroke-width="3" stroke-linecap="round"/></g>
    <!-- the perch (falcon eye) -->
    <circle cx="1000" cy="190" r="44" fill="#F2B807" opacity="0.18"/>
    <circle cx="1000" cy="190" r="30" fill="#F2B807" stroke="#17222B" stroke-width="5"/>
    <circle cx="1000" cy="190" r="17" fill="#17222B"/>
    <circle cx="1007" cy="183" r="5.5" fill="#E6ECF0"/>
    <!-- chip -->
    <g transform="translate(1048 128)">
      <rect width="206" height="40" rx="20" fill="#1F2E39" stroke="#2C3B46"/>
      <path d="M22 11 l-9 4 v7 c0 6 4 10 9 12 c5 -2 9 -6 9 -12 v-7z" fill="none" stroke="#2E9B63" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="40" y="26" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E6ECF0">Real location hidden</text>
    </g>
    <!-- logo + wordmark -->
    <g transform="translate(72 92)">
      <rect width="64" height="64" rx="14" fill="#17222B" stroke="#2C3B46"/>
      <path d="M24.5 37.5 C 22 45, 23.2 52.5, 26.7 56.5 C 29.5 51.2, 30.5 45, 29.5 39.5 Z" fill="#4A5D6B"/>
      <circle cx="34.5" cy="28.2" r="16" fill="#F2B807"/><circle cx="34.5" cy="28.2" r="11.5" fill="#17222B"/><circle cx="38.2" cy="24.5" r="3" fill="#E6ECF0"/>
      <text x="84" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#E6ECF0" letter-spacing="-0.5">Falcon Perch</text>
    </g>
    <text x="72" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#E6ECF0" letter-spacing="-1.5">Be anywhere.</text>
    <text x="72" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#F2B807" letter-spacing="-1.5">Stay private.</text>
    <text x="74" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#93A6B4">Open-source location privacy for Android · no account · no tracking</text>
  </g>
</svg>
